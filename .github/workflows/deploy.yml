name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Optional repository variables VOICE, RATE and SHORTCUT_URL override the defaults in wrangler.jsonc.
      - name: Deploy
        run: |
          args=()
          [ -n "$VOICE" ] && args+=(--var "VOICE:$VOICE")
          [ -n "$RATE" ] && args+=(--var "RATE:$RATE")
          [ -n "$SHORTCUT_URL" ] && args+=(--var "SHORTCUT_URL:$SHORTCUT_URL")
          npx wrangler deploy "${args[@]}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
          VOICE: ${{ vars.VOICE }}
          RATE: ${{ vars.RATE }}
          SHORTCUT_URL: ${{ vars.SHORTCUT_URL }}
      # Sync the feed token from the TOKEN repo secret. Skipped if the secret is not set.
      - name: Set TOKEN secret
        if: env.HAS_TOKEN == 'true'
        run: printf '%s' "$TOKEN" | npx wrangler secret put TOKEN
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}

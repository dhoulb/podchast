name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # All settings live in GitHub: Settings → Secrets and variables → Actions. See README "Settings".
      - name: Make Cloudflare resources
        run: node scripts/setup.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS }}
      # A repository variable with one of these names overrides the default in wrangler.jsonc.
      - name: Deploy
        run: |
          args=()
          for name in FEED_TITLE RETENTION_DAYS VOICE RATE PITCH EDGE_FORMAT TTS_ENGINE AI_MODEL AI_SPEAKER SHORTCUT_URL EMAIL_TO; do
            value=$(jq -r --arg n "$name" '.[$n] // empty' <<< "$VARS")
            [ -n "$value" ] && args+=(--var "$name:$value")
          done
          npx wrangler deploy "${args[@]}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
          VARS: ${{ toJSON(vars) }}
      # Copy secrets to the Worker. A secret that is not set in GitHub is left as it is on the Worker.
      - name: Set Worker secrets
        run: |
          json=$(jq -n --arg TOKEN "$TOKEN" --arg EMAIL_FROM "$EMAIL_FROM" '$ARGS.named | with_entries(select(.value != ""))')
          if [ "$json" != "{}" ]; then printf '%s' "$json" | npx wrangler secret bulk; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
          TOKEN: ${{ secrets.TOKEN }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      - name: Email Routing rule
        run: node scripts/setup.mjs email
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
